name: mashrutgo_mobile
description: "MashrutGo Flutter WebView wrapper: the web PWA is the product; this shell adds GPS/camera permissions, NFC, FCM push and deep links."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # WebView (platform packages are used directly for geolocation/camera permission prompts)
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.26.1

  # Push notifications (FCM)
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1

  # Native capabilities bridged to the web app
  permission_handler: ^12.0.1
  geolocator: ^14.0.3
  nfc_manager: ^4.2.1
  wakelock_plus: ^1.8.0

  # External links & connectivity
  url_launcher: ^6.3.2
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
